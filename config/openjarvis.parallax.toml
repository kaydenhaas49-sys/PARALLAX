# PARALLAX profile for the OpenJarvis backend.
# Uses the existing local llama.cpp OpenAI-compatible API.

[engine]
default = "llamacpp"

[engine.llamacpp]
host = "http://127.0.0.1:8080"

[intelligence]
# Empty means discover one from the selected local inference backend.
default_model = ""
temperature = 0.7
max_tokens = 1200

[agent]
default_agent = "orchestrator"
max_turns = 8
context_from_memory = true

[tools]
# Shell, arbitrary code execution and file writing are intentionally not enabled.
enabled = [
  "think",
  "calculator",
  "web_search",
  "file_read",
  "knowledge_search",
  "knowledge_sql",
  "scan_chunks",
  "memory_search",
  "memory_store",
  "browser",
  "parallax_list_applications",
  "parallax_launch_application",
  "parallax_list_windows",
  "parallax_focus_window",
  "parallax_get_system_status",
  "parallax_adjust_volume",
  "parallax_open_url",
  "parallax_search_files",
]

[tools.storage]
default_backend = "sqlite"
context_top_k = 5
context_max_tokens = 2048

[tools.mcp]
enabled = true

# Fully local voice input and output.
[speech]
backend = "faster-whisper"
model = "base"
language = "en"
device = "cpu"
compute_type = "int8"
tts_backend = "kokoro"
voice_id = "bm_george"
voice_speed = 1.0

[server]
host = "127.0.0.1"
port = 8123
agent = "orchestrator"
workers = 1

[learning]
enabled = true
auto_update = false

[telemetry]
enabled = true

[analytics]
enabled = false
